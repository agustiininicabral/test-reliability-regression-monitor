name: Test Reliability Monitor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-demo:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore historical SQLite database
        uses: actions/cache/restore@v4
        with:
          path: reports/history.sqlite3
          key: reliability-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            reliability-history-${{ runner.os }}-
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Dependency check
        run: python -m pip check
      - name: Lint
        run: ruff check monitor tests
      - name: Format check
        run: ruff format --check monitor tests
      - name: Unit tests with coverage gate
        run: pytest -q --cov=monitor --cov-report=term-missing --cov-report=xml --junitxml=reports/ci-run.xml
      - name: Analyze historical and current CI runs
        run: |
          python -m monitor.cli --junit examples/run-1.xml examples/run-2.xml reports/ci-run.xml --out reports/demo
          python -c "from pathlib import Path; required = ['reports/demo/reliability-report.json', 'reports/demo/reliability-report.md', 'reports/demo/reliability-report.html', 'reports/history.sqlite3', 'coverage.xml']; missing = [item for item in required if not Path(item).is_file()]; assert not missing, f'Missing expected files: {missing}'"
      - name: Save historical SQLite database
        if: success()
        uses: actions/cache/save@v4
        with:
          path: reports/history.sqlite3
          key: reliability-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-report-${{ runner.os }}
          path: |
            reports/
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
