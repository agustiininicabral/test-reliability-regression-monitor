name: Test Reliability Monitor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Dependency check
        run: python -m pip check
      - name: Lint
        run: ruff check monitor tests
      - name: Format check
        run: ruff format --check monitor tests
      - name: Unit tests
        run: pytest -q --junitxml=reports/ci-run.xml
      - name: Analyze sample historical runs
        run: |
          python -m monitor.cli --junit examples/run-1.xml examples/run-2.xml --out reports/demo
          test -f reports/demo/reliability-report.json
          test -f reports/demo/reliability-report.md
      - name: Upload reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-report
          path: |
            reports/
          if-no-files-found: warn
          retention-days: 14
