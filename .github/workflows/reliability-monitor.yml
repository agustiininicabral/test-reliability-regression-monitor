name: Test Reliability Monitor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore historical SQLite database
        uses: actions/cache/restore@v4
        with:
          path: reports/history.sqlite3
          key: reliability-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            reliability-history-
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Dependency check
        run: python -m pip check
      - name: Lint
        run: ruff check monitor tests
      - name: Format check
        run: ruff format --check monitor tests
      - name: Unit tests with coverage gate
        run: pytest -q --cov=monitor --cov-report=term-missing --cov-report=xml --junitxml=reports/ci-run.xml
      - name: Analyze historical and current CI runs
        run: |
          python -m monitor.cli --junit examples/run-1.xml examples/run-2.xml reports/ci-run.xml --out reports/demo
          test -f reports/demo/reliability-report.json
          test -f reports/demo/reliability-report.md
          test -f reports/demo/reliability-report.html
          test -f reports/history.sqlite3
          test -f coverage.xml
      - name: Save historical SQLite database
        if: success()
        uses: actions/cache/save@v4
        with:
          path: reports/history.sqlite3
          key: reliability-history-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-report
          path: |
            reports/
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
